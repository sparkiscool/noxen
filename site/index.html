<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nox assembly</title>
<style>
  :root { --bg:#111418; --panel:#1b2026; --text:#e6e8eb; --muted:#8a94a0; --line:#2a313a;
          --done:#3fb950; --stale:#d29922; --failed:#f85149; --pending:#6e7681; --placed:#8b949e; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  #app { display:grid; grid-template-columns: 300px 1fr; height:100%; }
  #side { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:12px; }
  #view { position:relative; }
  canvas { display:block; }
  h1 { font-size:16px; margin:4px 0 10px; }
  .sys { margin-bottom:14px; }
  .sys h2 { font-size:13px; color:var(--muted); margin:8px 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  .part { display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:4px; cursor:pointer; }
  .part:hover { background:#232a32; }
  .part.off { opacity:.4; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st { color:var(--muted); font-size:11px; }
  #legend { position:absolute; left:12px; bottom:12px; background:rgba(27,32,38,.9); padding:8px 10px; border-radius:6px; font-size:12px; display:flex; gap:12px; flex-wrap:wrap; }
  #legend span { display:inline-flex; align-items:center; gap:5px; }
  #ctl { position:absolute; right:12px; top:12px; display:flex; gap:6px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 9px; cursor:pointer; }
  input[type=range] { width:120px; }
  #card { position:absolute; right:12px; bottom:12px; width:340px; max-height:70%; overflow:auto; background:rgba(27,32,38,.96); border:1px solid var(--line); border-radius:8px; padding:12px; display:none; }
  #card h3 { margin:0 0 6px; font-size:14px; }
  #card img { width:100%; border-radius:4px; background:#000; }
  #card .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:12px; margin:8px 0; }
  #card .kv b { color:var(--muted); font-weight:500; }
  #card textarea { width:100%; box-sizing:border-box; height:70px; background:#0f1316; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:6px; font:12px/1.4 system-ui; resize:vertical; }
  #card .row { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  #card .msg { font-size:11px; color:var(--muted); margin-top:4px; min-height:14px; }
  #card .x { position:absolute; right:8px; top:6px; cursor:pointer; color:var(--muted); }
  @media (max-width:700px) { #app { grid-template-columns:1fr; grid-template-rows: 40% 60%; } #side { border-right:0; border-bottom:1px solid var(--line);} }
</style>
<script>/*INLINE*/</script>
</head>
<body>
<div id="app">
  <div id="side"><h1 id="h1">Nox assembly</h1><div class="st" id="commit"></div><div id="list"></div></div>
  <div id="view">
    <div id="ctl"><button id="fit">fit</button><button id="allon">all</button><button id="gen">generated only</button>
      <label>explode <input id="explode" type="range" min="0" max="2" step="0.01" value="0"></label></div>
    <div id="card"><span class="x" id="cardx">✕</span>
      <h3 id="c-name"></h3>
      <img id="c-img" alt="" style="display:none">
      <div class="kv" id="c-kv"></div>
      <textarea id="c-fb" placeholder="Feedback for the next session on this part (saved to parts/<name>/feedback.md)"></textarea>
      <div class="row">
        <button id="c-save">save feedback</button>
        <button id="c-rerun">rerun as is</button>
        <button id="c-token" title="GitHub token with contents + actions write on this repo">token</button>
      </div>
      <div class="msg" id="c-msg"></div>
    </div>
    <div id="legend">
      <span><i class="dot" style="background:var(--done)"></i>done</span>
      <span><i class="dot" style="background:var(--stale)"></i>stale</span>
      <span><i class="dot" style="background:var(--failed)"></i>failed</span>
      <span><i class="dot" style="background:var(--pending)"></i>pending</span>
      <span><i class="dot" style="background:var(--placed)"></i>bought / drawn</span>
    </div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const REPO = (window.INLINE && window.INLINE.repo) || (location.hostname.endsWith('github.io') ? location.hostname.split('.')[0] + '/' + location.pathname.split('/')[1] : 'sparkiscool/noxen');
const API = 'https://api.github.com/repos/' + REPO;
const ON_PAGES = location.hostname.endsWith('github.io') || location.hostname === 'localhost';   // the artifact's frame cannot reach GitHub
function b64(s, T) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new T(u.buffer); }
function geometryOf(m) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(b64(m.pos, Float32Array), 3));
  g.setIndex(new THREE.BufferAttribute(b64(m.idx, Uint32Array), 1));
  g.computeVertexNormals();
  return g;
}
function token() { try { return localStorage.getItem('gh_token') || ''; } catch (e) { return ''; } }
async function gh(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { 'Authorization': 'Bearer ' + token(), 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 120));
  return r.status === 204 ? null : r.json();
}
const card = document.getElementById('card');
let current = null;
function showCard(p) {
  current = p;
  document.getElementById('c-name').textContent = p.name + '  (' + p.status + ')';
  const img = document.getElementById('c-img'); if (p.preview) { img.src = p.preview + '?' + Date.now(); img.style.display = ''; } else img.style.display = 'none';
  const kv = [];
  if (p.mass_g != null) kv.push(['mass', Math.round(p.mass_g * 10) / 10 + ' g']);
  if (p.solid_ok != null) kv.push(['solid check', p.solid_ok ? 'PASS' : 'FAIL']);
  if (p.worst != null) kv.push(['worst index', p.worst + (p.max_worst != null ? ' / ' + p.max_worst + (p.strength_ok === false ? '  FAIL' : '') : '')]);
  if (p.worst_case) kv.push(['worst case', p.worst_case]);
  if (p.total_s) kv.push(['run time', Math.round(p.total_s / 60) + ' min']);
  document.getElementById('c-kv').innerHTML = kv.map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('');
  document.getElementById('c-fb').value = p.feedback || '';
  document.getElementById('c-fb').disabled = document.getElementById('c-save').disabled = document.getElementById('c-rerun').disabled = !p.has_script || !ON_PAGES;
  document.getElementById('c-msg').textContent = !p.has_script ? 'bought or hand-drawn part: nothing to rerun' : ON_PAGES ? '' : 'feedback and reruns: on the GitHub Pages copy of this page';
  card.style.display = 'block';
}
document.getElementById('cardx').onclick = () => card.style.display = 'none';
document.getElementById('c-token').onclick = () => { const t = prompt('GitHub fine-grained token for ' + REPO + ' (Contents: write, Actions: write). Stored only in this browser.'); if (t != null) { try { localStorage.setItem('gh_token', t.trim()); } catch (e) {} } };
document.getElementById('c-save').onclick = async () => {
  const msg = document.getElementById('c-msg'); const path = 'parts/' + current.id + '/feedback.md';
  const text = document.getElementById('c-fb').value;
  try {
    if (!token()) throw new Error('no token set (click token)');
    let sha; try { sha = (await gh('/contents/' + path)).sha; } catch (e) {}
    await gh('/contents/' + path, { method: 'PUT', body: JSON.stringify({ message: 'feedback: ' + current.id, content: btoa(unescape(encodeURIComponent(text))), sha }) });
    current.feedback = text; msg.textContent = 'saved to ' + path + '. Next: claude "' + current.id + '"';
  } catch (e) { msg.textContent = 'save failed: ' + e.message; }
};
document.getElementById('c-rerun').onclick = async () => {
  const msg = document.getElementById('c-msg');
  try {
    if (!token()) throw new Error('no token set (click token)');
    await gh('/actions/workflows/parts.yml/dispatches', { method: 'POST', body: JSON.stringify({ ref: 'main', inputs: { parts: current.id } }) });
    msg.textContent = 'rerun started for ' + current.id + ' (same setup). Check the Actions tab.';
  } catch (e) { msg.textContent = 'rerun failed: ' + e.message; }
};
const COLORS = { done:0x3fb950, stale:0xd29922, failed:0xf85149, pending:0x6e7681, placed:0x8b949e };
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(devicePixelRatio); view.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x111418);
const camera = new THREE.PerspectiveCamera(45, 1, 1, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(1, 2, 3); scene.add(dl);
scene.add(new THREE.GridHelper(600, 30, 0x2a313a, 0x1f252c).rotateX(Math.PI/2));

const root = new THREE.Group(); scene.add(root);
const groups = {};
const loader = new GLTFLoader();
const list = document.getElementById('list');

async function load() {
  const data = window.INLINE || await (await fetch('assembly.json', { cache:'no-store' })).json();
  document.getElementById('h1').textContent = data.title || (data.systems.length === 1 ? data.systems[0].title : 'Nox assembly');
  document.getElementById('commit').textContent = data.commit ? REPO + ' @ ' + data.commit : '';
  for (const s of data.systems) {
    const sec = document.createElement('div'); sec.className = 'sys'; sec.innerHTML = `<h2>${s.name}</h2>`; list.appendChild(sec);
    for (const p of s.parts) {
      const g = new THREE.Group(); g.userData = p; root.add(g); groups[s.name + '/' + p.id] = g;
      const row = document.createElement('div'); row.className = 'part';
      row.innerHTML = `<i class="dot" style="background:var(--${p.status})"></i><span class="nm" title="${p.name}">${p.name}</span><span class="st">${p.mass_g ? Math.round(p.mass_g)+' g' : ''}</span>`;
      row.querySelector('.dot').onclick = (e) => { e.stopPropagation(); g.visible = !g.visible; row.classList.toggle('off', !g.visible); };
      row.onclick = () => showCard(p);
      sec.appendChild(row);
      const mat = new THREE.MeshStandardMaterial({ color: COLORS[p.status] || 0x888888, roughness:.6, metalness:.05,
        transparent: p.kind === 'placeholder', opacity: p.kind === 'placeholder' ? .45 : 1 });
      const place = (obj) => { g.add(obj); new THREE.Box3().setFromObject(obj).getCenter(g.userData.center = new THREE.Vector3()); fit(); };
      const packed = data.meshes && data.meshes[s.file + '__' + p.id];
      if (packed) place(new THREE.Mesh(geometryOf(packed), mat));       // a self-contained page: geometry embedded
      else loader.load(p.glb, (gltf) => { gltf.scene.traverse(o => { if (o.isMesh) o.material = mat; }); place(gltf.scene); });
    }
  }
}
function fit() {
  const b = new THREE.Box3().setFromObject(root); if (b.isEmpty()) return;
  const c = b.getCenter(new THREE.Vector3()), r = b.getSize(new THREE.Vector3()).length() / 2;
  controls.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(1, -1.4, 0.9).normalize().multiplyScalar(r * 2.2));
  camera.near = r / 100; camera.far = r * 20; camera.updateProjectionMatrix(); controls.update();
}
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
document.getElementById('fit').onclick = fit;
document.getElementById('allon').onclick = () => { for (const g of Object.values(groups)) g.visible = true; document.querySelectorAll('.part').forEach(r => r.classList.remove('off')); };
document.getElementById('gen').onclick = () => { for (const g of Object.values(groups)) g.visible = g.userData.status !== 'placed'; };
document.getElementById('explode').oninput = (e) => {
  const k = +e.target.value; const c = new THREE.Box3().setFromObject(root).getCenter(new THREE.Vector3());
  for (const g of Object.values(groups)) { if (!g.userData.center) continue; g.position.copy(g.userData.center).sub(c).multiplyScalar(k); }
};
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
load();
</script>
</body>
</html>
