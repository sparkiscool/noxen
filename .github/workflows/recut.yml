# Recut finished parts on a runner (tools/recut.py: the current setup's cuts, the export cleanup and the solid gate on the
# existing part.stl, no re-solve) and commit the result. The gate voxelises the part at 0.25 mm: a 500k-face part (the head
# mount) needs more memory than a laptop or a session box has (29 Oct: the head mount recut died twice locally, rc 137).
name: recut

on:
  workflow_dispatch:
    inputs:
      parts:
        description: 'part names, space separated'
        required: true

permissions:
  contents: write
  actions: write

jobs:
  recut:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: recut
        run: python tools/recut.py ${{ inputs.parts }}
      - name: commit and push (retry on race)
        if: always()
        shell: bash
        run: |
          git config user.name nox-ci
          git config user.email ci@users.noreply.github.com
          for p in ${{ inputs.parts }}; do git add parts/$p/part.stl parts/$p/preview.png parts/$p/result.json 2>/dev/null || true; done
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "recut: ${{ inputs.parts }}"
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase origin main || exit 1
          done
          gh workflow run site.yml
        env:
          GH_TOKEN: ${{ github.token }}
