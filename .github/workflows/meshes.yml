# Drawn parts and print files (tools/make_parts.py, tools/print_mesh.py). On a push, every drawn part (parts/<p>/make.py) whose make.py or
# any file it was made from changed (its recorded reads, else its folder and the libs it imports) is made here: python make.py, the
# solid check on its print mesh (print/<p>.stl, else part.stl), its verdict in print.json "make" (15 Nov: drawn parts first-class, as a
# generated part's run). Then every print/*.stl goes to the `meshes` release as print-<name>.stl (listed in print/index.json), every
# part.stl that is not yet a published viewing mesh goes up as <part>.stl, the drones' assembly check runs on the tree as it now is,
# and the page is rebuilt. After every parts run it publishes what a run on an older parts.yml committed with its full mesh.
# A dispatch makes the drawn parts named ("all": every one), or with none only publishes. A part whose upload failed is put back as main has it.
name: meshes

on:
  push:
    branches: [main]
    paths: ['print/*.stl', 'parts/*/make.py', 'parts/*/**', 'parts/*.py', 'systems/**', 'tools/**']   # the drawn parts a change moves (make_parts.py --affected)
  workflow_run:                  # after every parts run: a result a run on an older parts.yml committed with its full mesh is published here
    workflows: [parts]
    types: [completed]
  workflow_dispatch:
    inputs:
      make:
        description: 'drawn parts to make and check, space separated ("all": every parts/*/make.py; empty: none)'
        required: false
        default: ''
      check:
        description: 'drawn parts to solid-check as committed, without making them ("all": every one)'
        required: false
        default: ''
      parts:
        description: 'part names to publish, space separated (empty = every part whose part.stl is not yet a published viewing mesh)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency: { group: meshes, cancel-in-progress: false }

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: make the drawn parts
        id: make
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # every commit of the push (the push's own range, as parts.yml), not only the last one, and every drawn part whose recorded
            # reads changed since its run (a queued run the next push cancelled made nothing: concurrency keeps one pending run)
            make=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null | python3 tools/make_parts.py --affected)
          else
            make="${{ inputs.make }}"; [ "$make" = "all" ] && make=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import make_parts; print(' '.join(make_parts.names()))")
          fi
          check="${{ inputs.check }}"; [ "$check" = "all" ] && check="--all"
          echo "make: ${make:-none}; check: ${check:-none}"
          rc=0
          if [ -n "$make" ]; then python3 tools/make_parts.py run $make || rc=1; fi
          if [ -n "$check" ]; then python3 tools/make_parts.py check $check || rc=1; fi
          echo "made=$make" >> "$GITHUB_OUTPUT"
          [ $rc = 0 ] || echo "::warning::a drawn part failed its make or its solid check (print.json make.solid says why); it is not print-ready on the page"
      - name: publish
        shell: bash
        run: |
          rc=0
          if ls print/*.stl >/dev/null 2>&1; then python3 tools/print_mesh.py print-files || rc=1; fi
          if [ -n "${{ inputs.parts }}" ]; then
            for p in ${{ inputs.parts }}; do python3 tools/print_mesh.py publish $p || { rc=1; git checkout -- parts/$p; }; done
          else
            python3 tools/print_mesh.py publish --all || rc=1
            # --all: a part whose upload failed is put back (its part.stl is then not the viewing mesh its record names)
            for p in $(git diff --name-only -- 'parts/*/result.json' 'parts/*/part.stl' | cut -d/ -f2 | sort -u); do
              python3 -c "import sys; sys.path.insert(0, 'tools'); import print_mesh; sys.exit(0 if print_mesh.published('$p') else 1)" || git checkout -- parts/$p
            done
          fi
          exit $rc
        env:
          GH_TOKEN: ${{ github.token }}
      - name: assembly check
        if: always()
        shell: bash
        run: |
          # the drones' gate on the tree as it is now (tools/assembly_check.py): its report per drone and each printed part's verdict in its
          # record (result.json, or print.json for a drawn part), in the same commit; a part in a failing pair, mate or path is not print-ready
          python3 tools/assembly_check.py --all --write | tee _assembly.txt || true
          grep -E '^  (CLASH|MATE|PATH)' _assembly.txt | head -40 | sed 's/^/::warning::assembly: /' || true; rm -f _assembly.txt
      - name: commit and push (retry on race)
        if: always()
        shell: bash
        run: |
          git config user.name nox-ci
          git config user.email ci@users.noreply.github.com
          git add -A print parts systems
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "meshes: drawn parts made and checked [${{ steps.make.outputs.made }}], print meshes to the release, viewing meshes in git"
          # a part whose result landed on main while this job worked (9 Nov: scout_v4_cradle, whose binary part.stl then failed the
          # rebase) keeps main's files: its newer result is published by the next dispatch (or by its own run on the new parts.yml)
          for i in 1 2 3 4 5 6 7 8; do
            if git push -q; then
              gh workflow run site.yml
              # the box's check when one of its streams' drawn parts was made (box.yml: funnel, latch, arm, stand, dome)
              echo " ${{ steps.make.outputs.made }} " | grep -Eq ' (box_|latch7)' && gh workflow run box.yml || true
              exit 0
            fi
            git fetch -q origin main
            for d in $(git diff --name-only HEAD~1 origin/main -- parts print systems | cut -d/ -f1-2 | sort -u); do
              echo "$d changed on main meanwhile: main's kept"
              git checkout origin/main -- "$d" 2>/dev/null || git rm -rq --ignore-unmatch "$d"
            done
            git diff --cached --quiet HEAD~1 && { echo "nothing left to commit"; exit 0; }
            git commit -q --amend --no-edit
            git rebase -q origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
