# Rebuilds the viewer page from systems/*.assembly.json and parts/*/ and publishes it to GitHub Pages.
# Runs after every results commit (parts.yml starts it) and after any edit to systems/ or site/.
name: site
on:
  push:
    branches: [main]
    paths: ['systems/**', 'site/**', 'parts/*/part.stl', 'parts/*/result.json', 'parts/*/feedback.md', 'tools/build_site.py']
  workflow_dispatch:

permissions: { pages: write, id-token: write, contents: read }
concurrency: { group: site, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install numpy trimesh fast_simplification
      - run: python tools/build_site.py --inline    # also site/<drone>.html, the drone's artifact file, every current part embedded
      - uses: actions/upload-pages-artifact@v4
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - id: d
        uses: actions/deploy-pages@v4
      - run: echo "page ${{ steps.d.outputs.page_url }}"
