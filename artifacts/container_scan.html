<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noxen scan to BIM: one container</title>
<style>
:root{--bg:#f3f4f6;--fg:#1b2130;--muted:#667085;--panel:#fff;--line:#d9dde3;--accent:#2f6fde;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#13161c;--fg:#e7e9ee;--muted:#98a2b3;--panel:#1b1f27;--line:#2d333d;--accent:#6ea0ff}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 var(--sans)}
.app{height:100%;display:grid;gap:10px;padding:12px 16px;grid-template-rows:auto minmax(260px,1fr) auto auto}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:17px;font-weight:600}h1 small{font-weight:400;color:var(--muted);margin-left:8px;font-size:13px}
.chip{font:500 12px/1 var(--mono);padding:5px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.panes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-height:0}
.pane{position:relative;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);cursor:grab;touch-action:none}
.pane.drag{cursor:grabbing}
.pane canvas{display:block;width:100%;height:100%}
.ph{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:6px 9px;pointer-events:none;font:600 12px var(--mono);color:#e7e9ee;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pane.bim .ph{color:var(--fg);text-shadow:none}
.ph .sp{flex:1}.ph label,.ph select{pointer-events:auto;font:500 11.5px var(--sans);display:flex;align-items:center;gap:4px}
.ph select{background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:1px 3px}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.bar label{display:flex;align-items:center;gap:6px;font-size:12.5px}.bar input[type=range]{width:150px}
.bar .hint{margin-left:auto;color:var(--muted);font-size:12px}
button{font:600 12.5px var(--sans);background:var(--panel);color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:5px 10px;cursor:pointer}
button.on{background:var(--accent);color:#fff}
.low{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;height:170px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow:auto;font-size:12.5px;min-height:0}
.card h2{margin:0 0 5px;font-size:13px}
.step{display:flex;gap:7px;padding:2px 0;color:var(--muted)}.step b{font:600 11px var(--mono);min-width:1.4em}
.step.on{color:var(--fg)}.step.on b{color:var(--accent)}
.row{display:flex;align-items:center;gap:7px;padding:2px 5px;border-radius:4px;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}.row.sel{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.sw{width:10px;height:10px;border-radius:2px;flex:none}.row .q{margin-left:auto;font:11px var(--mono);color:var(--muted)}
.k{font:12px var(--mono);color:var(--muted)}
@media (max-width:900px){.app{grid-template-rows:auto auto auto auto;overflow:auto}.panes{grid-template-columns:1fr}.pane{height:300px}.low{grid-template-columns:1fr;height:auto}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Noxen scan to BIM <small>one storage container, LiDAR + video &rarr; point map, BIM, video</small></h1>
  <span class="chip" id="chip">simulated scene</span>
</header>
<div class="panes">
  <div class="pane pt" id="p0"><canvas></canvas><div class="ph"><span>POINT MAP</span><span class="sp"></span><select id="cmode" title="point colour"><option value="0">video colour</option><option value="1">class</option><option value="2">height</option></select></div></div>
  <div class="pane bim" id="p1"><canvas></canvas><div class="ph"><span>BIM</span><span class="sp"></span><label><input type="checkbox" id="lab" checked>labels</label></div></div>
  <div class="pane vid" id="p2"><canvas></canvas><div class="ph"><span>VIDEO</span><span class="sp"></span><label><input type="checkbox" id="det">detections</label></div></div>
</div>
<div class="bar">
  <button id="tour">Walk-through</button>
  <label>position <input type="range" id="pos" min="0" max="1000" value="0"></label>
  <label>speed <input type="range" id="spd" min="2" max="30" value="10"></label>
  <button id="rescan">Rescan</button>
  <button id="shuf">New clutter</button>
  <button id="reset">Reset view</button>
  <label><input type="checkbox" id="spin" checked>slow spin</label>
  <span class="hint">drag: orbit (360&deg;) &middot; right-drag / shift-drag: pan &middot; wheel: zoom &middot; all three views share one camera &middot; click an object to pick it</span>
</div>
<div class="low">
  <div class="card"><h2>Pipeline</h2><div id="steps"></div></div>
  <div class="card"><h2>Objects <span class="k" id="ocount"></span></h2><div id="list"></div></div>
  <div class="card"><h2>Selected</h2><div id="info" class="k">Click an object or a row.</div></div>
</div>
</div>
<script>
(()=>{
"use strict";
const L=5.9,W=2.35,H=2.39,AIS=0.15;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ROT=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return[v[0]*c+v[2]*s,v[1],-v[0]*s+v[2]*c]};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};

/* ---------- classes ---------- */
const CLS=[
 {n:'Crate',bim:[217,154,78]},{n:'Pallet',bim:[196,178,98]},{n:'Pipe bundle',bim:[91,155,213]},
 {n:'Barrel',bim:[74,168,154]},{n:'Toolbox',bim:[217,83,79]},{n:'Cable drum',bim:[155,127,209]},
 {n:'Sacks',bim:[168,176,188]},{n:'Lumber',bim:[143,191,95]},{n:'Ladder',bim:[224,192,64]}];
const C={crate:0,pallet:1,pipe:2,barrel:3,tool:4,drum:5,sack:6,lumber:7,ladder:8};

/* ---------- scene ---------- */
let OBJ,POLY,PTS,seed=1207,NP;
const SHELL={wall:[72,104,96],floor:[128,100,70],roof:[108,118,116]};

function buildScene(sd){
  seed=sd;const R=mulberry(sd);const rr=(a,b)=>a+(b-a)*R();const pick=a=>a[(R()*a.length)|0];
  const objs=[],occ=[];
  const fits=(x,z,hw,hd)=>occ.every(o=>Math.abs(x-o.x)>=hw+o.hw+0.05||Math.abs(z-o.z)>=hd+o.hd+0.05);
  function place(hw,hd){
    for(let t=0;t<90;t++){
      const side=R()<.5?-1:1,x0=AIS+hw+0.03,x1=W/2-0.04-hw;if(x1<x0)return null;
      const x=side*rr(x0,x1),z=rr(-L/2+0.1+hd,L/2-0.25-hd);
      if(fits(x,z,hw,hd)){occ.push({x,z,hw,hd});return{x,z}}
    }return null}
  const fp=(w,d,yaw)=>[Math.abs(Math.cos(yaw))*w/2+Math.abs(Math.sin(yaw))*d/2,Math.abs(Math.sin(yaw))*w/2+Math.abs(Math.cos(yaw))*d/2];
  const add=(cls,x,y0,z,yaw,prims)=>{const o={cls,x,y0,z,yaw,prims};objs.push(o);return o};
  const box=(c,s,col,tex,yaw)=>({t:'box',c,s,col,tex:tex||'',yaw:yaw||0});
  const cyl=(c,r,h,axis,col,tex,n)=>({t:'cyl',c,r,h,axis,col,tex:tex||'',n:n||16,yaw:0});
  const woods=[[178,138,86],[160,122,76],[190,150,98]];
  // pipe bundles
  for(let k=0;k<2;k++){
    const len=rr(2.0,2.8),r=rr(0.045,0.07),col=pick([[118,126,134],[60,110,170],[205,110,40],[40,44,48]]),nb=pick([3,4]),pr=[];
    const hw=nb*r+0.02,pl=place(hw,len/2);if(!pl)continue;
    const yaw=rr(-.03,.03);
    for(let i=0;i<nb;i++)pr.push(cyl([(i-(nb-1)/2)*2.04*r,r,0],r,len,'z',col,'',14));
    for(let i=0;i<nb-1;i++)pr.push(cyl([(i-(nb-2)/2)*2.04*r,r+1.8*r,0],r,len,'z',col,'',14));
    add(C.pipe,pl.x,0,pl.z,yaw,pr);
  }
  // pallets with loads
  for(let k=0;k<2;k++){
    const pl=place(0.41,0.62);if(!pl)continue;const yaw=rr(-.05,.05),pr=[],wc=[205,170,110];
    for(const x of[-.35,0,.35])pr.push(box([x,.061,0],[.1,.078,1.2],wc,'slats'));
    for(let i=0;i<7;i++)pr.push(box([0,.134,-.55+i*.183],[.8,.022,.1],wc));
    for(const z of[-.55,0,.55])pr.push(box([0,.011,z],[.8,.022,.1],wc));
    add(C.pallet,pl.x,0,pl.z,yaw,pr);
    let y=.145;const nl=1+(R()<.55?1:0);
    for(let l=0;l<nl;l++){
      if(R()<.6){const w=rr(.55,.76),d=rr(.5,.9),h=rr(.3,.6);
        add(C.crate,pl.x+rr(-.03,.03),y,pl.z+rr(-.05,.05),yaw+rr(-.1,.1),[box([0,h/2,0],[w,h,d],pick(woods),'slats')]);y+=h}
      else{const pr2=[];for(let i=0;i<3;i++)pr2.push(box([rr(-.03,.03),.07+i*.14,rr(-.03,.03)],[.6,.14,.8],[212,206,190],'sack',rr(-.1,.1)));
        add(C.sack,pl.x,y,pl.z,yaw,pr2);y+=.42}
    }
  }
  // crates on floor
  for(let k=0;k<4;k++){
    const w=rr(.4,.75),d=rr(.4,.8),h=rr(.35,.8),yaw=rr(-.3,.3),[hw,hd]=fp(w,d,yaw),pl=place(hw,hd);if(!pl)continue;
    add(C.crate,pl.x,0,pl.z,yaw,[box([0,h/2,0],[w,h,d],pick(woods),'slats')]);
    if(R()<.4){const w2=w*.8,d2=d*.8,h2=rr(.25,.4);add(C.crate,pl.x,h,pl.z,yaw+rr(-.1,.1),[box([0,h2/2,0],[w2,h2,d2],pick(woods),'slats')])}
  }
  // barrels
  for(let k=0;k<4;k++){
    const r=.29,pl=place(r,r);if(!pl)continue;
    add(C.barrel,pl.x,0,pl.z,0,[cyl([0,.44,0],r,.88,'y',pick([[40,90,160],[170,50,45],[50,130,80],[200,160,40]]),'rings',18)]);
  }
  // tool boxes
  for(let k=0;k<3;k++){
    const yaw=rr(-.5,.5),[hw,hd]=fp(.55,.25,yaw),pl=place(hw,hd);if(!pl)continue;
    add(C.tool,pl.x,0,pl.z,yaw,[box([0,.11,0],[.55,.22,.25],[190,50,40],'lid'),box([0,.25,0],[.3,.03,.05],[40,40,44])]);
  }
  // cable drum
  {const pl=place(.3,.42);if(pl){const col=[150,105,70];
    add(C.drum,pl.x,0,pl.z,rr(-.1,.1),[cyl([-.22,.4,0],.4,.05,'x',col,'',18),cyl([.22,.4,0],.4,.05,'x',col,'',18),cyl([0,.4,0],.2,.4,'x',[60,60,66],'',14)])}}
  // ladder
  {const pl=place(.26,1.1);if(pl){const pr=[],col=[185,190,196];
    for(const x of[-.2,.2])pr.push(box([x,.035,0],[.04,.07,2.2],col));
    for(let i=0;i<8;i++)pr.push(box([0,.045,-.95+i*.27],[.4,.03,.03],[220,190,60]));
    add(C.ladder,pl.x,0,pl.z,rr(-.04,.04),pr)}}
  // lumber
  {const pl=place(.12,1.1);if(pl){const pr=[];const n=3+(R()<.5?1:0);
    for(let i=0;i<n;i++)pr.push(box([rr(-.01,.01),.02+i*.04,rr(-.1,.1)],[.2,.04,rr(2.0,2.3)],[190,150,95],'slats'));
    add(C.lumber,pl.x,0,pl.z,rr(-.03,.03),pr)}}
  // sacks on floor
  {const pl=place(.35,.45);if(pl){const pr=[],n=2+((R()*2)|0);
    for(let i=0;i<n;i++)pr.push(box([rr(-.03,.03),.07+i*.14,rr(-.03,.03)],[.6,.14,.8],[212,206,190],'sack',rr(-.12,.12)));
    add(C.sack,pl.x,0,pl.z,0,pr)}}
  return{objs,R};
}

function genPolys(objs){
  const polys=[];
  const add=(v,n,col,tex,obj,quad,wall)=>{
    if(obj>=0&&v.every(p=>p[1]<=0.004))return;
    let cx=0,cy=0,cz=0;for(const p of v){cx+=p[0];cy+=p[1];cz+=p[2]}
    polys.push({v,n,c:[cx/v.length,cy/v.length,cz/v.length],col,tex,obj,quad,wall:wall||0,line:null})};
  // shell
  const nx=5,nz=24,tw=W/nx,tl=L/nz,rows=5,th=H/rows;
  for(let i=0;i<nx;i++)for(let j=0;j<nz;j++){
    const x0=-W/2+i*tw,x1=x0+tw,z0=-L/2+j*tl,z1=z0+tl,sh=(j&1)?.94:1,fc=C=>C.map(v=>v*sh);
    add([[x0,0,z0],[x1,0,z0],[x1,0,z1],[x0,0,z1]],[0,1,0],fc(SHELL.floor),'floor',-1,true,3);
    add([[x0,H,z0],[x0,H,z1],[x1,H,z1],[x1,H,z0]],[0,-1,0],fc(SHELL.roof),'',-1,true,4);
  }
  for(let j=0;j<nz;j++)for(let r=0;r<rows;r++){
    const z0=-L/2+j*tl,z1=z0+tl,y0=r*th,y1=y0+th,sh=(j&1)?.9:1,c=SHELL.wall.map(v=>v*sh);
    add([[-W/2,y0,z0],[-W/2,y0,z1],[-W/2,y1,z1],[-W/2,y1,z0]],[1,0,0],c,'',-1,true,1);
    add([[W/2,y0,z0],[W/2,y1,z0],[W/2,y1,z1],[W/2,y0,z1]],[-1,0,0],c,'',-1,true,2);
  }
  for(let i=0;i<nx;i++)for(let r=0;r<rows;r++){
    const x0=-W/2+i*tw,x1=x0+tw,y0=r*th,y1=y0+th;
    add([[x0,y0,-L/2],[x0,y1,-L/2],[x1,y1,-L/2],[x1,y0,-L/2]],[0,0,1],SHELL.wall.map(v=>v*.85),'',-1,true,5);
  }
  // objects
  objs.forEach((o,oi)=>{
    for(const pr of o.prims){
      const place=v=>{let w=pr.t==='cyl'?(pr.axis==='z'?[v[0],v[2],v[1]]:pr.axis==='x'?[v[1],v[0],v[2]]:v):v;
        w=ROT(w,pr.yaw||0);w=[w[0]+pr.c[0],w[1]+pr.c[1],w[2]+pr.c[2]];w=ROT(w,o.yaw);return[w[0]+o.x,w[1]+o.y0,w[2]+o.z]};
      const dir=v=>{let w=pr.t==='cyl'?(pr.axis==='z'?[v[0],v[2],v[1]]:pr.axis==='x'?[v[1],v[0],v[2]]:v):v;return ROT(ROT(w,pr.yaw||0),o.yaw)};
      if(pr.t==='box'){
        const h=[pr.s[0]/2,pr.s[1]/2,pr.s[2]/2];
        for(let a=0;a<3;a++)for(const sg of[-1,1]){
          const b=(a+1)%3,c=(a+2)%3,cor=(ub,vc)=>{const v=[0,0,0];v[a]=sg*h[a];v[b]=ub*h[b];v[c]=vc*h[c];return place(v)};
          const nl=[0,0,0];nl[a]=sg;
          add([cor(-1,-1),cor(1,-1),cor(1,1),cor(-1,1)],dir(nl),pr.col,pr.tex,oi,true);
        }
      }else{
        const n=pr.n,r=pr.r,hh=pr.h/2;
        for(let i=0;i<n;i++){
          const a0=i/n*Math.PI*2,a1=(i+1)/n*Math.PI*2,am=(a0+a1)/2;
          add([place([r*Math.cos(a0),-hh,r*Math.sin(a0)]),place([r*Math.cos(a1),-hh,r*Math.sin(a1)]),place([r*Math.cos(a1),hh,r*Math.sin(a1)]),place([r*Math.cos(a0),hh,r*Math.sin(a0)])],
            dir([Math.cos(am),0,Math.sin(am)]),pr.col,pr.tex,oi,true);
        }
        for(const sg of[-1,1]){const v=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;v.push(place([r*Math.cos(a),sg*hh,r*Math.sin(a)]))}
          add(v,dir([0,sg,0]),pr.col.map(x=>x*.8),'',oi,false)}
      }
    }
  });
  return polys;
}

function texShade(tex,u,v,R){
  let f=1;
  if(tex==='slats'){const q=(v*4)%1;if(q<.08)f=.62}
  else if(tex==='rings'){const q=(v*5)%1;if(q<.06)f=.6}
  else if(tex==='floor'){const q=(u*5)%1;if(q<.05)f=.7}
  else if(tex==='sack'){const q=(u*6+v*3)%1;if(q<.05)f=.85}
  else if(tex==='lid'){if(Math.abs(v-.7)<.03)f=.55}
  return f*(1+(R()-.5)*.14);
}

function genPoints(objs,polys,R){
  const gauss=()=>(R()+R()+R()-1.5)*1.15;
  const xs=[],ys=[],zs=[],cr=[],cg=[],cb=[],clsA=[],objA=[],wallA=[],nxA=[],nyA=[],nzA=[];
  for(const p of polys){
    const v=p.v,dens=p.obj<0?150:850;
    let area;
    if(p.quad){area=Math.hypot(...cross(sub(v[1],v[0]),sub(v[3],v[0])))}
    else{area=0;for(let i=1;i<v.length-1;i++)area+=Math.hypot(...cross(sub(v[i],v[0]),sub(v[i+1],v[0])))/2}
    let n=area*dens;n=Math.floor(n)+(R()<n-Math.floor(n)?1:0);
    for(let k=0;k<n;k++){
      let x,y,z,u=0,w=0;
      if(p.quad){u=R();w=R();
        const a=[v[0][0]+(v[1][0]-v[0][0])*u,v[0][1]+(v[1][1]-v[0][1])*u,v[0][2]+(v[1][2]-v[0][2])*u];
        x=a[0]+(v[3][0]-v[0][0])*w;y=a[1]+(v[3][1]-v[0][1])*w;z=a[2]+(v[3][2]-v[0][2])*w}
      else{ // fan triangle, area weighted by retry-free approach: pick triangle uniformly (cap fans are regular)
        const t=1+((R()*(v.length-2))|0);let s=R(),q=R();if(s+q>1){s=1-s;q=1-q}
        x=v[0][0]+(v[t][0]-v[0][0])*s+(v[t+1][0]-v[0][0])*q;y=v[0][1]+(v[t][1]-v[0][1])*s+(v[t+1][1]-v[0][1])*q;z=v[0][2]+(v[t][2]-v[0][2])*s+(v[t+1][2]-v[0][2])*q}
      const e=p.obj<0?.004:.003,g=gauss()*e;
      x+=p.n[0]*g;y+=p.n[1]*g;z+=p.n[2]*g;
      const f=texShade(p.tex,u,w,R)*(p.obj<0?(.9+R()*.2):1);
      xs.push(x);ys.push(y);zs.push(z);cr.push(p.col[0]*f);cg.push(p.col[1]*f);cb.push(p.col[2]*f);
      clsA.push(p.obj<0?255:objs[p.obj].cls);objA.push(p.obj);wallA.push(p.wall);nxA.push(p.n[0]);nyA.push(p.n[1]);nzA.push(p.n[2]);
    }
  }
  const N=xs.length,stations=[];
  for(let i=0;i<7;i++)stations.push(tourCam(i/6).eye);
  // video colour: albedo lit by the walk-through lamp, best frame per point
  const vc=new Uint8Array(N*3),key=new Float32Array(N);
  for(let i=0;i<N;i++){
    let best=0;
    for(const e of stations){const d=[e[0]-xs[i],e[1]-ys[i],e[2]-zs[i]],d2=d[0]*d[0]+d[1]*d[1]+d[2]*d[2],nd=(nxA[i]*d[0]+nyA[i]*d[1]+nzA[i]*d[2])/Math.sqrt(d2);
      if(nd>0){const l=3.2*nd/(1+.45*d2);if(l>best)best=l}}
    const I=Math.pow(clamp(.3+.08*Math.max(0,nyA[i])+best,0,1.1),.8);

  select(-1);
}
const STEPS=['Capture: LiDAR sweep plus video frames from the walk-through','Register: scan aligned to the camera poses','Colourise: each point takes its colour from the frame that saw it','Segment: points clustered into objects, each given a class','Fit: a box or cylinder fitted to each object gives the BIM'];
document.getElementById('steps').innerHTML=STEPS.map((s,i)=>'<div class="step on"><b>'+(i+1)+'</b>'+s+'</div>').join('');
document.getElementById('tour').onclick=()=>{touring=!touring;document.getElementById('tour').classList.toggle('on',touring);if(touring)tourS=posEl.value/1000};
posEl.oninput=()=>{tourS=posEl.value/1000;touring=true;document.getElementById('tour').classList.add('on');frame.t=0};
document.getElementById('spd').oninput=e=>speed=+e.target.value;
document.getElementById('rescan').onclick=()=>{scanR=0;scanning=true};
document.getElementById('shuf').onclick=()=>{build((seed*7919+13)%100000)};
document.getElementById('reset').onclick=()=>{stopTour();Object.assign(cam,{yaw:HOME.yaw,pitch:HOME.pitch,dist:HOME.dist,t:HOME.t.slice()})};
document.getElementById('cmode').onchange=e=>cmode=+e.target.value;
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();document.getElementById('tour').click()}});
build(seed);resize();requestAnimationFrame(frame);
window.__scan={cam,get N(){return PTS.N},get objs(){return OBJ.length}};
})();
</script>
</body>
</html>
